<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Schedule · Jadual Kerja</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="schedule-board.css" />
    <link rel="stylesheet" href="schedule-day.css" />
  </head>
  <body class="schedule-day-page">
    <header class="day-header">
      <div class="day-header-main">
        <h1>Daily View · Jadual Kerja</h1>
        <p class="day-sub">填写群发模板详情 · 工人名单来自周排班</p>
      </div>
      <div class="day-toolbar">
        <label>
          Board
          <select id="day-mode">
            <option value="planning">Planning</option>
            <option value="actual">Actual</option>
          </select>
        </label>
        <label>
          Hari
          <select id="day-select">
            <option value="mon">Isnin</option>
            <option value="tue">Selasa</option>
            <option value="wed">Rabu</option>
            <option value="thu">Khamis</option>
            <option value="fri">Jumaat</option>
            <option value="sat">Sabtu</option>
            <option value="sun">Ahad</option>
          </select>
        </label>
        <button type="button" id="day-save">保存</button>
        <button type="button" id="day-export">复制群发文本</button>
        <button type="button" class="ghost" id="day-back">回周视图</button>
      </div>
    </header>

    <main class="day-layout">
      <section class="day-meta cardish" aria-label="当日抬头">
        <div class="field-grid">
          <label>
            日期（如 14/9/26）
            <input id="meta-date" type="text" placeholder="14/9/26" />
          </label>
          <label>
            PIC
            <input id="meta-pic" type="text" placeholder="JJ" />
          </label>
          <label>
            Supervisor
            <input id="meta-supervisor" type="text" placeholder="Federick" />
          </label>
        </div>
        <label class="full">
          工时说明（多行）
          <textarea id="meta-time" rows="2" placeholder="PGEO / Volac / Bahru / IKD - 8.30am-6.30pm&#10;Site Lain - 8.00am-6.00pm"></textarea>
        </label>
        <label class="full">
          开头备注（如 Masuk Access 6 PAGI）
          <input id="meta-preamble" type="text" placeholder="Masuk Access 6 PAGI" />
        </label>
        <label class="full">
          Tolong Minta Barang Keperluan Hari Ini
          <textarea id="meta-materials" rows="2" placeholder="Francis / Abdil"></textarea>
        </label>
      </section>

      <section class="day-jobs" aria-label="当日 Job 详情">
        <h2>当日 Job（来自周表，可补站点与说明）</h2>
        <div id="jobs-editor"></div>
        <p id="jobs-empty" class="jobs-empty hidden">这一天还没有安排任何人。请先在周视图拖拽分配。</p>
      </section>

      <section class="day-side" aria-label="覆盖与休假">
        <div id="day-coverage" class="day-coverage"></div>
        <div id="day-cuti" class="day-cuti"></div>
      </section>

      <section class="day-preview cardish" aria-label="预览">
        <div class="preview-head">
          <h2>群发预览</h2>
          <button type="button" id="day-refresh-preview" class="ghost">刷新预览</button>
        </div>
        <pre id="day-preview-text" class="day-preview-text"></pre>
      </section>
    </main>

    <script src="schedule-store.js"></script>
    <script src="schedule-day.js"></script>
  </body>
</html>
