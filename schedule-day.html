<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Schedule · Jadual Kerja</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="schedule-board.css" />
    <link rel="stylesheet" href="schedule-day.css" />
  </head>
  <body class="schedule-day-page">
    <header class="day-header">
      <div class="day-header-main">
        <h1>Daily View · Jadual Kerja</h1>
        <p class="day-sub">Fill WhatsApp template details · crew list comes from the weekly board</p>
      </div>
      <div class="day-toolbar">
        <label>
          Board
          <select id="day-mode">
            <option value="planning">Planning</option>
            <option value="actual">Actual</option>
          </select>
        </label>
        <label>
          Day
          <select id="day-select">
            <option value="mon">Monday</option>
            <option value="tue">Tuesday</option>
            <option value="wed">Wednesday</option>
            <option value="thu">Thursday</option>
            <option value="fri">Friday</option>
            <option value="sat">Saturday</option>
            <option value="sun">Sunday</option>
          </select>
        </label>
        <button type="button" id="day-save">Save</button>
        <button type="button" id="day-export">Copy Jadual Text</button>
        <button type="button" class="ghost" id="day-back">← Weekly Board</button>
      </div>
    </header>

    <main class="day-layout">
      <section class="day-meta cardish" aria-label="Day header">
        <div class="field-grid">
          <label>
            Date (e.g. 14/9/26)
            <input id="meta-date" type="text" placeholder="14/9/26" />
          </label>
          <label>
            PIC
            <input id="meta-pic" type="text" placeholder="JJ" />
          </label>
          <label>
            Supervisor
            <input id="meta-supervisor" type="text" placeholder="Federick" />
          </label>
        </div>
        <label class="full">
          Time notes (multi-line)
          <textarea id="meta-time" rows="2" placeholder="PGEO / Volac / Bahru / IKD - 8.30am-6.30pm&#10;Site Lain - 8.00am-6.00pm"></textarea>
        </label>
        <label class="full">
          Preamble (e.g. Masuk Access 6 PAGI)
          <input id="meta-preamble" type="text" placeholder="Masuk Access 6 PAGI" />
        </label>
        <label class="full">
          Tolong Minta Barang Keperluan Hari Ini
          <textarea id="meta-materials" rows="2" placeholder="Francis / Abdil"></textarea>
        </label>
      </section>

      <section class="day-jobs" aria-label="Job details">
        <h2>Jobs today (from weekly board — add site &amp; description)</h2>
        <div id="jobs-editor"></div>
        <p id="jobs-empty" class="jobs-empty hidden">No one assigned for this day yet. Assign people on the weekly board first.</p>
      </section>

      <section class="day-side" aria-label="Coverage and leave">
        <div id="day-coverage" class="day-coverage"></div>
        <div id="day-cuti" class="day-cuti"></div>
      </section>

      <section class="day-preview cardish" aria-label="Preview">
        <div class="preview-head">
          <h2>Jadual preview</h2>
          <button type="button" id="day-refresh-preview" class="ghost">Refresh</button>
        </div>
        <pre id="day-preview-text" class="day-preview-text"></pre>
      </section>
    </main>

    <script src="schedule-store.js"></script>
    <script src="schedule-day.js"></script>
  </body>
</html>
